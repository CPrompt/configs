
#Auto-start session
new-session -d -s main -n vim
send-keys -t main:vim vim C-m

new-window -t main -n bash
new-window -t main -n ranger	ranger
new-window -t main -n btop		btop
new-window -t main -n cmus		cmus
new-window -t main -n irssi		irssi

select-window -t main:vim

set-option -g default-shell /bin/bash
set-option -g default-command "bash --login"

run ~/.tmux/themes/tmux-gruvbox/gruvbox-tpm.tmux
set -g @tmux-gruvbox 'dark'
